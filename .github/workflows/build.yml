name: Build and Upload Artifacts

on:
  push:
    branches: [ master, main, dev, develop ]
  pull_request:
    branches: [ master, main, dev, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '8'
        
    - name: Cache Gradle packages
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew || echo "No gradlew found, using system gradle"
      
    - name: Setup Forge workspace
      run: |
        if [ -f gradlew ]; then
          ./gradlew setupDecompWorkspace --no-daemon
        else
          gradle setupDecompWorkspace --no-daemon
        fi
      continue-on-error: true
      
    - name: Build with Gradle
      run: |
        if [ -f gradlew ]; then
          ./gradlew build --no-daemon --stacktrace
        else
          gradle build --no-daemon --stacktrace
        fi
        
    - name: List build outputs
      run: |
        echo "Build directory contents:"
        ls -lah build/libs/ || echo "No build/libs directory found"
        
    - name: Upload mod JAR
      uses: actions/upload-artifact@v4
      with:
        name: mod-jar
        path: build/libs/*.jar
        if-no-files-found: error
        retention-days: 30
        
    - name: Upload API JAR
      uses: actions/upload-artifact@v4
      with:
        name: api-jar
        path: build/libs/*-api.jar
        if-no-files-found: ignore
        retention-days: 30
        
    - name: Upload build logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: |
          build/logs/
          .gradle/
        if-no-files-found: ignore
        retention-days: 7
